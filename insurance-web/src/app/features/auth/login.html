<main class="auth-page split">
  <app-theme-toggle class="theme-corner" />
  <app-auth-brand-panel />

  <section class="auth-form">
    <app-brand-logo class="auth-mobile-logo" />

    <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage your policies and claims.</p>

      @if (error()) {
      <div class="alert" role="alert">{{ error() }}</div>
      }

      <label class="field">
        Email
        <input type="email" formControlName="email" autocomplete="email" />
        @if (f.email.touched && f.email.invalid) {
        <small class="err">Enter a valid email address.</small>
        }
      </label>

      <label class="field">
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (f.password.touched && f.password.invalid) {
        <small class="err">Password is required.</small>
        }
      </label>

      <button class="btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>

      <p class="alt">No account? <a routerLink="/register">Create one</a></p>
    </form>
  </section>
</main>

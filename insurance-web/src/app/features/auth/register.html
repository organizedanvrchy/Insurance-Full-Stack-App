<main class="auth-page">
  <app-theme-toggle class="theme-corner" />
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Create account</h1>

    @if (error()) {
    <div class="alert" role="alert">{{ error() }}</div>
    }

    <label class="field">
      Full name
      <input type="text" formControlName="fullName" autocomplete="name" />
      @if (f.fullName.touched && f.fullName.invalid) {
      <small class="err">Full name is required.</small>
      }
    </label>

    <label class="field">
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (f.email.touched && f.email.invalid) {
      <small class="err">Enter a valid email address.</small>
      }
    </label>

    <label class="field">
      Phone (optional)
      <input type="tel" formControlName="phone" autocomplete="tel" />
    </label>

    <label class="field">
      Address (optional)
      <input type="text" formControlName="address" autocomplete="street-address" />
    </label>

    <label class="field">
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (f.password.touched && f.password.invalid) {
      <small class="err">Use 8 to 72 characters.</small>
      }
    </label>

    <label class="field">
      Confirm password
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (f.confirmPassword.touched && form.hasError('mismatch')) {
      <small class="err">Passwords do not match.</small>
      }
    </label>

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="alt">Already registered? <a routerLink="/login">Sign in</a></p>
  </form>
</main>
